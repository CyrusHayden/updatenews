name: diag-images
on:
  push:
    paths: [".github/workflows/diag.yml"]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests beautifulsoup4 pyyaml cryptography
      - run: |
          python - <<'PY'
          import bot, requests
          for q in ["HSBC", "Barclays", "Standard Chartered", "Barclays HSBC Standard Chartered", "AI job cuts", "Artificial intelligence", "Donald Trump"]:
              u = bot.wiki_image(q)
              b = bot.load_image_bytes(u) if u else None
              st = ""
              if u:
                  r = requests.get(u, headers=bot.WIKI_UA, timeout=30); st = f"{r.status_code} {r.text[:120] if r.status_code!=200 else ''}"
              print(f"::notice::{q} | url={'yes' if u else 'NO'} | bytes={len(b) if b else 0} | {st}")
          PY
