name: News Bot

on:
  workflow_dispatch:            # chạy mỗi 15 phút do cron-job.org gọi API (chạy cả bot signal + bot tin tức), hoặc bấm "Run workflow" để chạy tay

permissions:
  contents: write               # để lưu state.enc (nhớ đã lấy tới tin nào)

concurrency:
  group: news-bot
  cancel-in-progress: false     # không chạy chồng 2 lượt

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run signal bot (tin forward vào Auto Post Assistant)
        continue-on-error: true       # bot signal lỗi cũng không làm hỏng bot tin tức
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
          AUTO_POST_ASSISTANT_ID: ${{ secrets.AUTO_POST_ASSISTANT_ID }}
          INBOX_LINK: ${{ secrets.INBOX_LINK }}
        run: python signal_bot.py
      - name: Run bot
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
        run: python bot.py
      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          [ -f state.enc ] || exit 0
          git add state.enc
          git diff --cached --quiet || (git commit -m "update [skip ci]" && git pull --rebase && git push)
