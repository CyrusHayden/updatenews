name: News Bot

on:
  workflow_dispatch:            # chạy mỗi 5 phút do cron-job.org gọi API (chạy cả bot signal + bot tin tức), hoặc bấm "Run workflow" để chạy tay

permissions:
  contents: write               # để lưu state.enc (nhớ đã lấy tới tin nào)

concurrency:
  group: news-bot
  cancel-in-progress: false     # không chạy chồng 2 lượt

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Đăng hàng chờ outbox (bài Claude đẩy lên sau khi bạn duyệt)
        continue-on-error: true       # lỗi cũng không làm hỏng các bot khác
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
          AUTO_POST_ASSISTANT_ID: ${{ secrets.AUTO_POST_ASSISTANT_ID }}
        run: python outbox_post.py
      - name: Run signal bot (tin forward vào Auto Post Assistant)
        continue-on-error: true       # bot signal lỗi cũng không làm hỏng bot tin tức
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
          AUTO_POST_ASSISTANT_ID: ${{ secrets.AUTO_POST_ASSISTANT_ID }}
          INBOX_LINK: ${{ secrets.INBOX_LINK }}
        run: python signal_bot.py
      - name: Kiểm tra công tắc bot tin tức (news_enabled trong config.yaml)
        id: news
        if: always()
        run: |
          if grep -Eq '^news_enabled:[[:space:]]*false' config.yaml; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Bot tin tức đang TẠM DỪNG (news_enabled: false) - bỏ qua bước Run bot."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bot
        if: always() && steps.news.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
        run: python bot.py
      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          for f in state.enc signal_mode.txt; do if [ -f "$f" ]; then git add "$f"; fi; done
          git add -A outbox              # ghi nhận bài outbox đã đăng (file bị xóa) để không đăng trùng
          git diff --cached --quiet && exit 0
          git commit -m "update [skip ci]"
          # GitHub thỉnh thoảng trục trặc khi push -> thử lại 3 lần; vẫn lỗi thì chỉ cảnh báo, không báo run fail
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            echo "Push lỗi lần $i, thử lại sau 10 giây..."; sleep 10
          done
          echo "::warning::Không lưu được trạng thái lên GitHub (GitHub trục trặc). Lượt sau sẽ lưu lại."
